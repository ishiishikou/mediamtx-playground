name: mediamtx-smartphone

services:
  cert-generator:
    build:
      context: ..
      dockerfile: docker/smartphone-cert/Dockerfile
    image: mediamtx-playground-smartphone-cert:local
    user: "${SMARTPHONE_UID:-1000}:${SMARTPHONE_GID:-1000}"
    environment:
      SMARTPHONE_LAN_IP: "${SMARTPHONE_LAN_IP:-127.0.0.1}"
    volumes:
      - type: bind
        source: ../tmp/smartphone/certs
        target: /work/certs
        bind:
          create_host_path: false
      - type: bind
        source: ../tmp/smartphone/public
        target: /work/public
        bind:
          create_host_path: false
      - type: bind
        source: ../tmp/smartphone/generated
        target: /work/generated
        bind:
          create_host_path: false
      - ./mediamtx.smartphone.example.yml:/templates/mediamtx.smartphone.example.yml:ro

  mediamtx:
    image: bluenviron/mediamtx:1
    container_name: mediamtx-smartphone
    restart: "no"
    volumes:
      - type: bind
        source: ../tmp/smartphone/generated/mediamtx.yml
        target: /mediamtx.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../tmp/smartphone/certs/server.crt
        target: /certs/server.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../tmp/smartphone/certs/server.key
        target: /certs/server.key
        read_only: true
        bind:
          create_host_path: false
      - ../scripts/poc/hooks:/hooks:ro
    ports:
      - "127.0.0.1:8554:8554"
      - "127.0.0.1:8888:8888"
      - "8889:8889"
      - "8189:8189/udp"
      - "127.0.0.1:9997:9997"
      - "127.0.0.1:9998:9998"

  cert-server:
    image: busybox:1.36
    container_name: mediamtx-smartphone-ca
    restart: "no"
    command: ["httpd", "-f", "-p", "80", "-h", "/public"]
    volumes:
      - type: bind
        source: ../tmp/smartphone/public
        target: /public
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "8000:80"
